<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>{const e=new URLSearchParams(location.search).get("ep");if(e&&/^[a-z0-9_]+$/.test(e))location.replace("tales/"+e+".html"+location.hash);}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen — StoryBook</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="StoryBook">
<meta property="og:url" content="https://storybook-audio.fly.dev/listen.html">
<meta property="og:title" content="Listen · StoryBook">
<meta property="og:description" content="Fairy tales and public-domain classics performed by a full cast of voices, with sound effects and music. Free to listen.">
<meta property="og:image" content="https://storybook-audio.fly.dev/assets/og/og-listen.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Listen · StoryBook">
<meta name="twitter:description" content="Fairy tales and public-domain classics performed by a full cast of voices, with sound effects and music. Free to listen.">
<meta name="twitter:image" content="https://storybook-audio.fly.dev/assets/og/og-listen.jpg">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script src="js/analytics.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
</svg>
<div class="book">
<header class="running-head">
  <a class="wordmark" href="./">StoryBook</a>
  <nav class="nav" aria-label="Main">
    <a href="./">Listen</a><a href="./#tales" aria-current="page">Library</a><a href="personal.html">For your child</a><a href="studio.html">Studio</a><a href="./#craft">How it's made</a>
  </nav>
</header>
<aside class="offerbar" aria-label="Made for you">
  <a href="personal.html" data-track="cta_click" data-track-cta="bar_personal"><b>A fairy tale starring your child</b> <span class="ob-p">· <span data-price="personal">$6</span></span> <span class="ob-go">Free preview →</span></a>
  <a href="studio.html" data-track="cta_click" data-track-cta="bar_studio"><b>Your own pages as an audiobook</b> <span class="ob-p">· from <span data-price="studio-from">$9</span></span> <span class="ob-go">Upload →</span></a>
</aside>
<section class="spread featured" id="root">
  <div class="page verso">
    <figure class="plate">
      <div class="sheet" id="sheet"><img id="art" src="assets/paint/blob2.png" alt=""></div>
      <figcaption><b>Plate</b><span id="cap"></span></figcaption>
    </figure>
  </div>
  <div class="page recto">
    <p class="running" id="mood">from the library</p>
    <h2 id="title">…</h2>
    <p class="byline" id="byline"></p>
    <p class="blurb dropcap" id="blurb"></p>
    <div id="player"></div>
    <p class="folio"><a href="./#tales">← back to the contents</a></p>
  </div>
</section>
<footer class="colophon">
  <p class="finis">Finis.</p>
  <p>Texts from <a href="https://www.gutenberg.org">Project Gutenberg</a>. Voices by Kokoro-82M. Every sound is synthesised.</p>
</footer>
</div>
<script type="module">
import { mountPlayer, loadCatalog, artUrl } from "./js/player.js";
const slug = new URLSearchParams(location.search).get("ep");
const cat = await loadCatalog();
const ep = cat.episodes.find((e) => e.slug === slug) || cat.episodes[0];
document.title = `${ep.title} — StoryBook`;
for (const [id, v] of [["title", ep.title], ["byline", `${ep.author}${ep.year ? " · " + ep.year : ""}`], ["blurb", ep.blurb || ""], ["mood", ep.mood || ""], ["cap", ep.caption || ep.title]])
  document.getElementById(id).textContent = v;
const art = document.getElementById("art");
art.src = artUrl(ep.art);
art.alt = `A watercolour plate for ${ep.title}`;
if (ep.art && !ep.art.startsWith("land_")) document.getElementById("sheet").classList.add("eye");
const root = document.getElementById("root");
mountPlayer(document.getElementById("player"), ep, { onplay: () => root.classList.add("playing"), onpause: () => root.classList.remove("playing") });
</script>
<script>
fetch("/api/config").then((r) => r.json()).then((c) => {
  const set = (k, v) => v && document.querySelectorAll(`[data-price="${k}"]`).forEach((el) => (el.textContent = v));
  set("personal", c.pricing?.personal?.price); set("studio-from", c.pricing?.studio?.[0]?.price);
}).catch(() => {});
</script>
</body>
</html>
