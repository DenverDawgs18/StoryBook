<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen — StoryBook</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script src="js/analytics.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
</svg>
<div class="book">
<header class="running-head">
  <a class="wordmark" href="./">StoryBook</a>
  <nav class="nav" aria-label="Main">
    <a href="./">Listen</a><a href="./#tales" aria-current="page">Library</a><a href="personal.html">For your child</a><a href="studio.html">Studio</a><a href="./#craft">How it's made</a>
  </nav>
</header>
<section class="spread featured" id="root">
  <div class="page verso">
    <figure class="plate">
      <div class="sheet" id="sheet"><img id="art" src="assets/paint/blob2.png" alt=""></div>
      <figcaption><b>Plate</b><span id="cap"></span></figcaption>
    </figure>
  </div>
  <div class="page recto">
    <p class="running" id="mood">from the library</p>
    <h2 id="title">…</h2>
    <p class="byline" id="byline"></p>
    <p class="blurb dropcap" id="blurb"></p>
    <div id="player"></div>
    <p class="folio"><a href="./#tales">← back to the contents</a></p>
  </div>
</section>
<footer class="colophon">
  <p class="finis">Finis.</p>
  <p>Texts from <a href="https://www.gutenberg.org">Project Gutenberg</a>. Voices by Kokoro-82M. Every sound is synthesised.</p>
</footer>
</div>
<script type="module">
import { mountPlayer, loadCatalog, artUrl } from "./js/player.js";
const slug = new URLSearchParams(location.search).get("ep");
const cat = await loadCatalog();
const ep = cat.episodes.find((e) => e.slug === slug) || cat.episodes[0];
document.title = `${ep.title} — StoryBook`;
for (const [id, v] of [["title", ep.title], ["byline", `${ep.author}${ep.year ? " · " + ep.year : ""}`], ["blurb", ep.blurb || ""], ["mood", ep.mood || ""], ["cap", ep.caption || ep.title]])
  document.getElementById(id).textContent = v;
const art = document.getElementById("art");
art.src = artUrl(ep.art);
art.alt = `A watercolour plate for ${ep.title}`;
if (ep.art && !ep.art.startsWith("land_")) document.getElementById("sheet").classList.add("eye");
const root = document.getElementById("root");
mountPlayer(document.getElementById("player"), ep, { onplay: () => root.classList.add("playing"), onpause: () => root.classList.remove("playing") });
</script>
</body>
</html>
