# Deploys to Fly.io (app in fly.toml) whenever the default branch moves.
# Needs a FLY_API_TOKEN repository secret; see "Automatic deploys" in README.md.
name: Deploy to Fly

on:
  push:
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Follows whatever the repo's default branch is, so renaming it to main needs no edit here.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check for FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is not set. See 'Automatic deploys' in README.md."
            exit 1
          fi

      # --ha=false keeps the app on ONE machine: Studio jobs live in that machine's memory.
      - name: Deploy
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
