# Build check for pull requests: the Docker image must build, the server must
# start, and the same health check Fly uses (/api/voices) must answer.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compile Python sources
        run: python3 -m compileall -q storybook server tools

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: storybook:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name storybook -p 8080:8080 storybook:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/voices > /dev/null; then
              echo "Server is up"; exit 0
            fi
            sleep 2
          done
          echo "Server never answered /api/voices"
          docker logs storybook
          exit 1
